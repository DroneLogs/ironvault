<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Propolis</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <img class="mark" src="icons/icon48.png" alt="" width="20" height="20" />
      <span class="wordmark">Propolis</span>
      <span id="state" class="pill" hidden></span>
      <span id="site"></span>
    </header>

    <p id="message" hidden></p>

    <div id="connect" hidden>
      <p class="hint">
        This browser has not been approved yet. Propolis will ask you to confirm
        it, in the app itself.
      </p>
      <button id="connect-button" class="primary">Connect to Propolis</button>
    </div>

    <div id="search-wrap" hidden>
      <input id="search" type="search" placeholder="Filter" autocomplete="off" spellcheck="false" />
    </div>

    <ul id="entries" hidden></ul>

    <p id="empty" class="hint" hidden>No entries in your vault match this site.</p>

    <footer class="bar">
      <span id="count"></span>
      <button id="refresh" class="ghost">Refresh</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
